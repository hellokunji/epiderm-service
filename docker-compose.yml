services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: clinic
      POSTGRES_USER: epiderm
      POSTGRES_PASSWORD: epiderm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epiderm -d clinic"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: epiderm
      MONGO_INITDB_ROOT_PASSWORD: epiderm
      MONGO_INITDB_DATABASE: clinic
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "-u",
          "epiderm",
          "-p",
          "epiderm",
          "--authenticationDatabase",
          "admin",
          "--quiet",
          "--eval",
          "db.adminCommand('ping')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://epiderm:epiderm@postgres:5432/clinic
      MONGODB_URL: mongodb://epiderm:epiderm@mongo:27017/?authSource=admin
      MONGODB_DB_NAME: clinic
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  consumer:
    build:
      context: .
      target: api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://epiderm:epiderm@postgres:5432/clinic
      MONGODB_URL: mongodb://epiderm:epiderm@mongo:27017/?authSource=admin
      MONGODB_DB_NAME: clinic
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    command:
      - celery
      - -A
      - app.core.celery_app
      - worker
      - -Q
      - questionnaire_submitted
      - -n
      - consumer@%h
      - --pool=solo
      - --loglevel=info
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      target: diagnosis-worker
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://epiderm:epiderm@postgres:5432/clinic
      MONGODB_URL: mongodb://epiderm:epiderm@mongo:27017/?authSource=admin
      MONGODB_DB_NAME: clinic
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_DIAGNOSIS_WORKER_CONCURRENCY: ${CELERY_DIAGNOSIS_WORKER_CONCURRENCY:-1}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      RAG_ENABLED: ${RAG_ENABLED:-true}
    command:
      - celery
      - -A
      - app.core.celery_app
      - worker
      - -Q
      - diagnosis_ready
      - -n
      - worker@%h
      - --pool=solo
      - --concurrency=${CELERY_DIAGNOSIS_WORKER_CONCURRENCY:-1}
      - --loglevel=info
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  mongo_data:
  redis_data:
